name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test firmware logic
        run: ./tools/test-firmware

      - name: Build and test Linux client
        run: ./tools/build-host

      - name: Build RP2040 firmware
        run: ./tools/build-firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: couch-cec-rp2040
          path: build/firmware/pico-cec.uf2
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: couch-cec-rp2040
          path: release

      - name: Name and checksum firmware
        run: |
          mv release/pico-cec.uf2 release/couch-cec-rp2040-${{ github.ref_name }}.uf2
          cd release
          sha256sum *.uf2 > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.uf2
            release/SHA256SUMS
